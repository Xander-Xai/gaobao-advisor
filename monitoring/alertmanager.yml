# Alertmanager Configuration
# Routes alerts to Slack and Email

global:
  # SMTP configuration for email notifications
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@gaokao-advisor.com'
  smtp_auth_username: 'alerts@gaokao-advisor.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  
  # Slack API URL (use environment variable)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-notifications'
  
  routes:
    # Critical alerts → Slack + Email + Phone
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    # Warning alerts → Slack only
    - match:
        severity: warning
      receiver: 'slack-notifications'
    
    # Info alerts → Slack (low priority channel)
    - match:
        severity: info
      receiver: 'info-notifications'

# Receivers
receivers:
  # Slack notifications (default)
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#gaokao-alerts'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
        actions:
          - type: button
            text: 'View in Grafana'
            url: 'https://gaokao.example.com/grafana'

  # Critical alerts (Slack + Email)
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#gaokao-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
    email_configs:
      - to: 'admin@gaokao-advisor.com'
        send_resolved: true
        headers:
          Subject: '🚨 CRITICAL ALERT: {{ .CommonAnnotations.summary }}'

  # Info notifications (separate channel)
  - name: 'info-notifications'
    slack_configs:
      - channel: '#gaokao-info'
        send_resolved: false
        title: 'ℹ️ {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

# Inhibition rules
inhibit_rules:
  # Suppress warning alerts if critical alert is active for same service
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']
