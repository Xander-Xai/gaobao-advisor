[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaobao-advisor"
version = "3.1.0"
description = "高考志愿 AI 顾问 — 基于 RAG + LangGraph 的智能志愿填报助手"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "gaobao-ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]

dependencies = [
    "openai>=1.0.0,<3.0.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
    "langsmith>=0.8.18,<0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "sse-starlette>=1.0.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0,<3.0.0",
    "sentry-sdk>=1.30.0",
    "pydantic>=2.0.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "mcp>=1.0.0,<2.0.0",
]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/yandexuanxuan/gaobao-advisor"
Repository = "https://github.com/yandexuanxuan/gaobao-advisor"
Issues = "https://github.com/yandexuanxuan/gaobao-advisor/issues"

[tool.setuptools.packages.find]
include = [
    "server*",
    "agent*",
    "db*",
    "quality*",
    "scrapers*",
    "analytics*",
    "scripts*",
    "mcp_server*",
    "prompts*",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
    "--cov=server",
    "--cov=quality",
    "--cov=analytics",
    "--cov=slots",
    "--cov=config",
    "--cov=db",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
    "ignore:.*Please use `import python_multipart` instead.*:PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

[tool.ruff]
# `*.md` is excluded because ruff >= 0.17 formats Python code blocks inside
# Markdown. That formatting is not shipped code and only produced churn in the
# docs/ plans, so CI is scoped to the Python sources the project actually runs.
extend-exclude = [".claude", "*.md"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "B007", "F841", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "db", "quality", "scrapers", "analytics"]
