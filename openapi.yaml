info:
  description: AI 高考志愿顾问 — 考研规划 — 职业方向
  title: gaobao-advisor
  version: 3.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Root endpoint with API info.
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/v1/admin/audit-logs:
    get:
      operationId: audit_logs_api_v1_admin_audit_logs_get
      parameters:
      - in: query
        name: action
        required: false
        schema:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Action
      - in: query
        name: actor
        required: false
        schema:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Actor
      - in: query
        name: page
        required: false
        schema:
          default: 1
          maximum: 100000
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Audit Logs
      tags:
      - admin
  /api/v1/admin/auth/login:
    post:
      operationId: login_api_v1_admin_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
