components:
  schemas:
    AdminLoginRequest:
      additionalProperties: false
      properties:
        password:
          maxLength: 256
          minLength: 8
          title: Password
          type: string
        username:
          maxLength: 64
          minLength: 3
          title: Username
          type: string
      required:
      - username
      - password
      title: AdminLoginRequest
      type: object
    AdminTokenOut:
      properties:
        access_token:
          title: Access Token
          type: string
        expires_in:
          title: Expires In
          type: integer
        token_type:
          const: bearer
          default: bearer
          title: Token Type
          type: string
        user:
          $ref: '#/components/schemas/AdminUserOut'
      required:
      - access_token
      - expires_in
      - user
      title: AdminTokenOut
      type: object
    AdminUserOut:
      properties:
        role:
          enum:
          - viewer
          - operator
          - admin
          title: Role
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - role
      title: AdminUserOut
      type: object
    AdmissionScoreOut:
      properties:
        avg_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Score
        batch:
          title: Batch
          type: string
        id:
          title: Id
          type: integer
        major_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Major Name
        max_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Score
        min_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Rank
        min_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Score
        plan_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Plan Count
        province:
          title: Province
          type: string
        subject_type:
          title: Subject Type
          type: string
        year:
          title: Year
          type: integer
      required:
      - id
      - major_name
      - province
      - year
      - batch
      - subject_type
      - min_score
      - avg_score
      - max_score
      - min_rank
      - plan_count
      title: AdmissionScoreOut
      type: object
    AuditLogOut:
      properties:
        action:
          title: Action
          type: string
        actor:
          title: Actor
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        detail:
          additionalProperties: true
          title: Detail
          type: object
        id:
          title: Id
          type: integer
        outcome:
          title: Outcome
          type: string
        request_id:
          title: Request Id
          type: string
        resource_id:
          title: Resource Id
          type: string
        resource_type:
          title: Resource Type
          type: string
        role:
          title: Role
          type: string
      required:
      - id
      - request_id
      - actor
      - role
      - action
      - resource_type
      - resource_id
      - outcome
      - detail
      - created_at
      title: AuditLogOut
      type: object
    AuditPageOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogOut'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        pages:
          title: Pages
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      - pages
      title: AuditPageOut
      type: object
    ChatRequest:
      properties:
        message:
          maxLength: 3000
          minLength: 1
          title: Message
          type: string
        scene:
          default: gaokao
          title: Scene
          type: string
        session_id:
          description: 会话ID：4-64位字母数字下划线连字符
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
        slots:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Slots
      required:
      - session_id
      - message
      title: ChatRequest
      type: object
    EnrollmentPlanOut:
      properties:
        batch:
          anyOf:
          - type: string
          - type: 'null'
          title: Batch
        id:
          title: Id
          type: integer
        major_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Major Name
        plan_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Plan Count
        province:
          title: Province
          type: string
        subject_requirement:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Requirement
        tuition:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tuition
        year:
          title: Year
          type: integer
      required:
      - id
      - major_name
      - province
      - year
      - plan_count
      - subject_requirement
      - batch
      - tuition
      title: EnrollmentPlanOut
      type: object
    FeedbackRequest:
      description: 用户反馈请求
      properties:
        feedback_text:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Feedback Text
        message_index:
          maximum: 10000.0
          minimum: 0.0
          title: Message Index
          type: integer
        quality_score_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Quality Score Id
        rating:
          pattern: ^(helpful|not_helpful)$
          title: Rating
          type: string
        session_id:
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
      required:
      - session_id
      - message_index
      - rating
      title: FeedbackRequest
      type: object
    GenerateRequest:
      description: Request body for report generation.
      properties:
        session_id:
          title: Session Id
          type: string
        student_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Name
      required:
      - session_id
      title: GenerateRequest
      type: object
    GenerateResponse:
      description: Response body for report generation.
      properties:
        message:
          title: Message
          type: string
        report_id:
          title: Report Id
          type: string
        status:
          title: Status
          type: string
      required:
      - report_id
      - status
      - message
      title: GenerateResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HighlightExtractRequest:
      description: 金句提取请求
      properties:
        content:
          maxLength: 2000
          minLength: 10
          title: Content
          type: string
        score:
          default: 0
          maximum: 100.0
          minimum: 0.0
          title: Score
          type: integer
        session_id:
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
      required:
      - session_id
      - content
      title: HighlightExtractRequest
      type: object
    KnowledgeSearchRequest:
      properties:
        groups:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Groups
        query:
          title: Query
          type: string
        top_k:
          default: 5
          title: Top K
          type: integer
      required:
      - query
      title: KnowledgeSearchRequest
      type: object
    NextQuestionResponse:
      properties:
        is_complete:
          title: Is Complete
          type: boolean
        question:
          anyOf:
          - type: string
          - type: 'null'
          title: Question
        round_count:
          title: Round Count
          type: integer
        session_id:
          title: Session Id
          type: string
      required:
      - session_id
      - question
      - round_count
      - is_complete
      title: NextQuestionResponse
      type: object
    OnboardingRequest:
      properties:
        data:
          additionalProperties: true
          title: Data
          type: object
        step:
          title: Step
          type: integer
      required:
      - step
      - data
      title: OnboardingRequest
      type: object
    ProfileResponse:
      properties:
        is_complete:
          title: Is Complete
          type: boolean
        missing_fields:
          items:
            type: string
          title: Missing Fields
          type: array
        profile:
          additionalProperties: true
          title: Profile
          type: object
        session_id:
          title: Session Id
          type: string
      required:
      - session_id
      - profile
      - is_complete
      - missing_fields
      title: ProfileResponse
      type: object
    ProfileUpdateRequest:
      properties:
        field:
          maxLength: 32
          minLength: 1
          title: Field
          type: string
        value:
          maxLength: 200
          minLength: 1
          title: Value
          type: string
      required:
      - field
      - value
      title: ProfileUpdateRequest
      type: object
    QualityIssueOut:
      properties:
        entity_id:
          title: Entity Id
          type: integer
        entity_type:
          title: Entity Type
          type: string
        field_name:
          title: Field Name
          type: string
        id:
          title: Id
          type: integer
        message:
          title: Message
          type: string
        rule_code:
          title: Rule Code
          type: string
        severity:
          enum:
          - ERROR
          - WARNING
          - INFO
          title: Severity
          type: string
        suggestion:
          anyOf:
          - type: string
          - type: 'null'
          title: Suggestion
      required:
      - id
      - rule_code
      - severity
      - entity_type
      - entity_id
      - field_name
      - message
      - suggestion
      title: QualityIssueOut
      type: object
    QualityJobCreateOut:
      properties:
        job:
          $ref: '#/components/schemas/QualityJobOut'
        queue_state:
          enum:
          - DISPATCHED
          - INLINE
          - UNAVAILABLE
          - DISABLED
          title: Queue State
          type: string
        replayed:
          default: false
          title: Replayed
          type: boolean
        warning:
          anyOf:
          - type: string
          - type: 'null'
          title: Warning
      required:
      - job
      - queue_state
      title: QualityJobCreateOut
      type: object
    QualityJobCreateRequest:
      additionalProperties: false
      properties:
        filters:
          $ref: '#/components/schemas/QualityJobFilters'
      title: QualityJobCreateRequest
      type: object
    QualityJobDetailOut:
      properties:
