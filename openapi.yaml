          - maxLength: 20
            type: string
          - type: 'null'
          title: Level
        province:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          title: Province
        school_id:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: School Id
        subject_type:
          anyOf:
          - maxLength: 10
            type: string
          - type: 'null'
          title: Subject Type
        year:
          anyOf:
          - maximum: 2100.0
            minimum: 2000.0
            type: integer
          - type: 'null'
          title: Year
