components:
  schemas:
    ChatRequest:
      properties:
        message:
          maxLength: 3000
          minLength: 1
          title: Message
          type: string
        scene:
          default: gaokao
          title: Scene
          type: string
        session_id:
          description: 会话ID：4-64位字母数字下划线连字符
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
        slots:
          anyOf:
          - type: object
          - type: 'null'
          title: Slots
      required:
      - session_id
      - message
      title: ChatRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    KnowledgeSearchRequest:
      properties:
        groups:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Groups
        query:
          title: Query
          type: string
        top_k:
          default: 5
          title: Top K
          type: integer
      required:
      - query
      title: KnowledgeSearchRequest
      type: object
    NextQuestionResponse:
      properties:
        is_complete:
          title: Is Complete
          type: boolean
        question:
          anyOf:
          - type: string
          - type: 'null'
          title: Question
        round_count:
          title: Round Count
          type: integer
        session_id:
          title: Session Id
          type: string
      required:
      - session_id
      - question
      - round_count
      - is_complete
      title: NextQuestionResponse
      type: object
    OnboardingRequest:
      properties:
        data:
          title: Data
          type: object
        step:
          title: Step
          type: integer
      required:
      - step
      - data
      title: OnboardingRequest
      type: object
    ProfileResponse:
      properties:
        is_complete:
          title: Is Complete
          type: boolean
        missing_fields:
          items:
            type: string
          title: Missing Fields
          type: array
        profile:
          title: Profile
          type: object
        session_id:
          title: Session Id
          type: string
      required:
      - session_id
      - profile
      - is_complete
      - missing_fields
      title: ProfileResponse
      type: object
    ProfileUpdateRequest:
      properties:
        field:
          maxLength: 32
          minLength: 1
          title: Field
          type: string
        value:
          maxLength: 200
          minLength: 1
          title: Value
          type: string
      required:
      - field
      - value
      title: ProfileUpdateRequest
      type: object
    SkipFieldRequest:
      properties:
        field:
          maxLength: 32
          minLength: 1
          title: Field
          type: string
      required:
      - field
      title: SkipFieldRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: AI 高考志愿顾问 — 考研规划 — 职业方向
  title: gaobao-advisor
  version: 3.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Root endpoint with API info.
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/v1/chat:
    post:
      operationId: chat_api_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Chat
      tags:
      - chat
  /api/v1/data/plans:
    get:
      description: Query enrollment plans for a school.
      operationId: get_plans_api_v1_data_plans_get
      parameters:
      - description: 学校名称
        in: query
        name: school_name
        required: true
        schema:
          description: 学校名称
          title: School Name
          type: string
      - description: 省份
        in: query
        name: province
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 省份
          title: Province
      - description: 年份
        in: query
        name: year
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 年份
          title: Year
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Plans
      tags:
      - data
  /api/v1/data/schools:
    get:
      description: Search schools by name, province, or level.
      operationId: get_schools_api_v1_data_schools_get
      parameters:
      - description: 学校名称关键词
        in: query
        name: school_name
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 学校名称关键词
          title: School Name
      - description: 省份
        in: query
        name: province
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 省份
          title: Province
      - description: 学校层次
        in: query
        name: level
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 学校层次
          title: Level
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Schools
      tags:
      - data
  /api/v1/data/scores:
    get:
      description: Query admission scores for a school.
      operationId: get_scores_api_v1_data_scores_get
      parameters:
      - description: 学校名称
        in: query
        name: school_name
        required: true
        schema:
          description: 学校名称
          title: School Name
          type: string
      - description: 省份
        in: query
        name: province
        required: true
        schema:
          description: 省份
          title: Province
          type: string
      - description: 年份
        in: query
        name: year
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 年份
          title: Year
      - description: 专业
        in: query
        name: major
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 专业
          title: Major
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Scores
      tags:
      - data
  /api/v1/health:
    get:
      description: Basic liveness probe with DB status.
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health Check
      tags:
      - health
  /api/v1/knowledge/quotes:
    get:
      description: 'Get expert quotes, optionally filtered by major.


        Returns empty results when RAG is not configured (e.g. during tests).'
      operationId: get_quotes_api_v1_knowledge_quotes_get
      parameters:
      - description: 专业名称
        in: query
        name: major
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 专业名称
          title: Major
      - in: query
        name: top_k
        required: false
        schema:
          default: 5
          maximum: 20
          minimum: 1
          title: Top K
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Quotes
      tags:
      - knowledge
  /api/v1/knowledge/search:
    post:
      description: 'Search the knowledge base for relevant content.


        Returns empty results when RAG is not configured (e.g. during tests).'
      operationId: search_knowledge_api_v1_knowledge_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSearchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Search Knowledge
      tags:
      - knowledge
  /api/v1/onboarding:
    post:
      operationId: onboarding_step_api_v1_onboarding_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Onboarding Step
      tags:
      - onboarding
  /api/v1/profile/{session_id}:
    get:
      description: Get current user profile and completeness status.
      operationId: get_profile_api_v1_profile__session_id__get
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Profile
      tags:
      - profile
    put:
      description: Update a single profile field.
      operationId: update_profile_field_api_v1_profile__session_id__put
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Profile Field
      tags:
      - profile
  /api/v1/profile/{session_id}/next-question:
    get:
      description: Get the next soul query question for this session.
      operationId: get_next_question_api_v1_profile__session_id__next_question_get
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextQuestionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Next Question
      tags:
      - profile
  /api/v1/profile/{session_id}/skip:
    post:
      description: Skip an optional field (uses default value).
      operationId: skip_field_api_v1_profile__session_id__skip_post
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipFieldRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Skip Field
      tags:
      - profile
