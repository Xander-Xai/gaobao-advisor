components:
  schemas:
    ChatRequest:
      properties:
        message:
          maxLength: 3000
          minLength: 1
          title: Message
          type: string
        scene:
          default: gaokao
          title: Scene
          type: string
        session_id:
          description: 会话ID：4-64位字母数字下划线连字符
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]+$
          title: Session Id
          type: string
        slots:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Slots
      required:
      - session_id
      - message
      title: ChatRequest
      type: object
    FeedbackRequest:
      description: 用户反馈请求
      properties:
        feedback_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Feedback Text
        message_index:
          minimum: 0.0
          title: Message Index
          type: integer
        quality_score_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Quality Score Id
        rating:
          pattern: ^(helpful|not_helpful)$
          title: Rating
          type: string
        session_id:
          maxLength: 64
          minLength: 4
          title: Session Id
          type: string
      required:
      - session_id
      - message_index
      - rating
      title: FeedbackRequest
      type: object
    GenerateRequest:
      description: Request body for report generation.
      properties:
        session_id:
          maxLength: 64
          minLength: 4
          pattern: ^[a-zA-Z0-9_\-]{4,64}$
          title: Session Id
          type: string
        student_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Name
        token:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      required:
      - session_id
      title: GenerateRequest
      type: object
    GenerateResponse:
      description: Response body for report generation.
      properties:
        message:
          title: Message
          type: string
        report_id:
          title: Report Id
          type: string
        status:
          title: Status
          type: string
      required:
      - report_id
      - status
      - message
      title: GenerateResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HighlightExtractRequest:
      description: 金句提取请求
      properties:
        content:
          minLength: 10
          title: Content
          type: string
        score:
          default: 0
          maximum: 100.0
          minimum: 0.0
          title: Score
          type: integer
        session_id:
          maxLength: 64
          minLength: 4
          title: Session Id
          type: string
      required:
      - session_id
      - content
      title: HighlightExtractRequest
      type: object
    KnowledgeSearchRequest:
      properties:
        groups:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Groups
        query:
          title: Query
          type: string
        top_k:
          default: 5
          title: Top K
          type: integer
      required:
      - query
      title: KnowledgeSearchRequest
      type: object
    NextQuestionResponse:
      properties:
        is_complete:
          title: Is Complete
          type: boolean
        question:
          anyOf:
          - type: string
          - type: 'null'
          title: Question
        round_count:
          title: Round Count
          type: integer
        session_id:
          title: Session Id
          type: string
      required:
      - session_id
      - question
      - round_count
      - is_complete
      title: NextQuestionResponse
      type: object
    OnboardingRequest:
      properties:
        data:
          additionalProperties: true
          title: Data
          type: object
        step:
          title: Step
          type: integer
      required:
      - step
      - data
      title: OnboardingRequest
      type: object
    ProfileResponse:
      properties:
        is_complete:
          title: Is Complete
          type: boolean
        missing_fields:
          items:
            type: string
          title: Missing Fields
          type: array
        profile:
          additionalProperties: true
          title: Profile
          type: object
        session_id:
          title: Session Id
          type: string
      required:
      - session_id
      - profile
      - is_complete
      - missing_fields
      title: ProfileResponse
      type: object
    ProfileUpdateRequest:
      properties:
        field:
          maxLength: 32
          minLength: 1
          title: Field
          type: string
        value:
          maxLength: 200
          minLength: 1
          title: Value
          type: string
      required:
      - field
      - value
      title: ProfileUpdateRequest
      type: object
    SkipFieldRequest:
      properties:
        field:
          maxLength: 32
          minLength: 1
          title: Field
          type: string
      required:
      - field
      title: SkipFieldRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: AI 志愿规划服务，支持高考、考研和职业方向分析
