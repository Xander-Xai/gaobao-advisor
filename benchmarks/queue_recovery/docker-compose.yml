name: gaobao-qr

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: qrroot
      MYSQL_DATABASE: gaobao_queue_recovery_benchmark
    ports:
      - "127.0.0.1:3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pqrroot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    tmpfs:
      - /var/lib/mysql
    mem_limit: 2g
    cpus: "2.0"
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
    volumes:
      - redis_data:/data
    mem_limit: 512m
    cpus: "1.0"
    restart: "no"

networks:
  default:
    ipam:
      config:
        - subnet: 10.250.250.0/24

volumes:
  redis_data:
