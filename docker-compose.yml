version: '3.8'

services:
  advisor:
    build: .
    container_name: gaokao-advisor
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data          # SQLite 持久化
      - ./.env:/app/.env:ro       # 环境变量（只读挂载）
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 可选：Nginx 反向代理（HTTPS）
  nginx:
    image: nginx:alpine
    container_name: gaokao-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro  # SSL 证书目录
    depends_on:
      advisor:
        condition: service_healthy
