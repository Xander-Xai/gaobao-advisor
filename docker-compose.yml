services:
  api:
    build: .
    container_name: gaokao-api
    command:
      - /bin/sh
      - -c
      - |
        python scripts/seed_demo_data.py --database /app/data/demo.db
        exec uvicorn server.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_ENV: development
      LLM_PROVIDER: demo
      LLM_BASE_URL: demo://local
      LLM_MODEL: gaobao-demo
      ENABLE_RAG_KB: "false"
      RAG_EMBEDDING_PROVIDER: keyword
      VOICE_ENABLED: "false"
      GAOBAO__DB_PATH: /app/data/demo.db
    volumes:
      - gaobao-demo-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: gaokao-frontend
    restart: unless-stopped
    ports:
      - "3080:80"

  nginx:
    image: nginx:alpine
    container_name: gaokao-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  gaobao-demo-data:
