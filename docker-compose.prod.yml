# Production Docker Compose for Gaokao Advisor
# Usage: docker compose -f docker-compose.prod.yml --profile nginx up -d
# NOTE: Streamlit has been replaced by FastAPI (ADR-001). Port 8000 is the main API.

services:
  api:
    build: .
    image: ${PROD_API_IMAGE:-gaobao-advisor-api:prod}
    container_name: ${PROD_API_CONTAINER_NAME:-gaokao-api-prod}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROD_API_PORT:-8000}:8000"
    volumes:
      - gaobao_prod_data:/app/data  # SQLite 持久化（命名卷，避免宿主机 UID 权限差异）
    # The application does not load /app/.env itself. Compose must inject the
    # file as environment variables so SESSION_SECRET / ADMIN_TOKEN_SECRET are
    # actually visible to the process. Missing file fails closed at startup.
    env_file:
      - path: ${PROD_ENV_FILE:-.env.production}
        required: true
    environment:
      - APP_ENV=production
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_RATE_LIMIT_BACKEND=redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: gaokao-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gaobao_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    container_name: gaokao-frontend-prod
    restart: unless-stopped
    profiles:
      - nginx
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx 反向代理（可选，通过 --profile nginx 启用）
  nginx:
    image: nginx:alpine
    container_name: gaokao-nginx-prod
    restart: unless-stopped
    profiles:
      - nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
volumes:
  gaobao_prod_data:
  gaobao_redis_prod_data:

networks:
  default:
    name: gaokao-network
