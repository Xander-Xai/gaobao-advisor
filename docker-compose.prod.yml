# Production Docker Compose for Gaokao Advisor
# Usage: docker compose -f docker-compose.prod.yml --profile nginx up -d

services:
  advisor:
    build: .
    container_name: gaokao-advisor-prod
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data          # SQLite 持久化
      - ./.env.production:/app/.env:ro  # 生产环境变量（只读挂载）
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Nginx 反向代理（可选，通过 --profile nginx 启用）
  nginx:
    image: nginx:alpine
    container_name: gaokao-nginx-prod
    restart: unless-stopped
    profiles:
      - nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro  # SSL 证书目录
    depends_on:
      advisor:
        condition: service_healthy

networks:
  default:
    name: gaokao-network
