title = "gaobao-advisor secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Exact documentation and test placeholders — never real credentials. Historical hits are example strings in docs/tests only."
regexTarget = "match"
regexes = [
  '''your-api-key-here''',
  '''your-siliconflow-api-key-here''',
  '''your_api_key_here''',
  '''test-key-123''',
  '''sk-your-api-key-here''',
  '''https://hooks\.slack\.com/services/YOUR/WEBHOOK/URL''',
  '''https://hooks\.slack\.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX''',
  '''Bearer YOUR_TOKEN''',
]

[[allowlists]]
description = "Synthetic idempotency keys in the admin UI test fixture — not credentials."
regexTarget = "match"
regexes = [
  """idem-key-123456""",
  """fixture-idempotency-key""",
]
paths = ["""frontend/src/views/__tests__/AdminView.spec.ts"""]
