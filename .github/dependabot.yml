# Version-update PRs are intentionally limited to zero: Python dependencies
# are locked through `uv pip compile` and must be regenerated/audited as one
# change, while frontend upgrades need a manual test pass. Repository-level
# Dependabot *security* updates remain enabled and still open advisories.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
