name: Temporary Ruff Verify

on:
  push:
    branches:
      - fix/bug-audit-20260824
    paths:
      - '.github/workflows/tmp-ruff-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/bug-audit-20260824

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CI dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Record successful verification
        shell: bash
        run: |
          printf 'ruff check: pass\nruff format --check: pass\n' > .github/ruff-verified.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ruff-verified.txt
          git commit -m "ci: record ruff verification"
          git push origin HEAD:fix/bug-audit-20260824
