name: Temporary Ruff Format Exact

on:
  push:
    branches:
      - fix/bug-audit-20260824
    paths:
      - ".github/workflows/tmp-ruff-format-exact.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bug-audit-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show Ruff version
        run: ruff --version
      - name: Format Python files
        run: ruff format .
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          if git diff --cached --quiet; then
            echo "No Ruff formatting changes"
            exit 0
          fi
          git commit -m "style: match CI ruff formatting"
          git push origin HEAD:fix/bug-audit-20260824
