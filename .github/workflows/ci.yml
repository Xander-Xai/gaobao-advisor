name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    name: Secret Scan (Git History)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --strict --requirement requirements.lock

  release-gates:
    name: Release Policy Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and license inventory tool
        run: pip install -e . pip-licenses

      - name: Validate public documentation
        run: python scripts/check_docs.py

      - name: Validate dependency licenses
        run: python scripts/check_licenses.py --python "$(command -v python)"

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Audit public repository contents
        run: bash scripts/audit_open_source.sh

  container-smoke:
    name: No-key Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start community demo
        run: |
          cp .env.example .env
          docker compose up --detach --build api frontend

      - name: Verify API, frontend, and disclosed demo chat
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/health.json").read_text())
          assert health["status"] == "ok", health
          assert health["mode"] == "demo", health
          assert health["optional_services"] == {"rag": "disabled", "voice": "disabled"}, health
          PY
          curl --fail --silent http://localhost:3080/ > /dev/null
          curl --fail --silent --no-buffer \
            --header 'Content-Type: application/json' \
            --data '{"session_id":"ci-demo","message":"请给我一个演示"}' \
            http://localhost:8000/api/v1/chat > /tmp/chat.sse
          python - <<'PY'
          import json
          from pathlib import Path

          tokens = []
          for line in Path("/tmp/chat.sse").read_text().splitlines():
              if line.startswith("data: "):
                  event = json.loads(line.removeprefix("data: "))
                  if event.get("type") == "token":
                      tokens.append(event.get("content", ""))
          reply = "".join(tokens)
          for marker in ("演示模式", "合成", "非官方"):
              assert marker in reply, (marker, reply)
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop community demo
        if: always()
        run: docker compose down --volumes --remove-orphans

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov-fail-under=70

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
