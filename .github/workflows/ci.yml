name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Generate synthetic demo database
        run: python -m scripts.seed_demo_data --db data/demo.db --reset
      - name: Run tests with coverage
        run: python -m pytest tests/ --tb=short --cov-fail-under=70
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.lock --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (production)
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret Scan (Git History)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build

  container:
    name: No-Key Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gb-advisor:ci .
      - name: Start without any API key
        run: |
          docker run -d --name gb-advisor -p 8000:8000 gb-advisor:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
      - name: Health must report synthetic profile and honest RAG state
        run: |
          python - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          assert h["data_profile"] == "SYNTHETIC_DEMO", h
          assert h["optional_services"]["rag"]["state"] == "RAG_DISABLED", h
          assert "rag" in h["degraded_services"], h
          print(json.dumps(h, indent=2))
          PY
      - name: Synthetic data endpoints respond
        run: |
          curl -sf "http://localhost:8000/api/v1/data/schools?limit=3" | python -c "import sys,json;d=json.load(sys.stdin);assert d['items'];print('schools ok:',len(d['items']))"
      - if: always()
        run: docker logs gb-advisor || true

  redistribution-gate:
    name: Redistribution Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Generate synthetic demo database
        run: python -m scripts.seed_demo_data --db data/demo.db --reset
      - name: No restricted assets may be tracked
        # Coverage threshold belongs to the full suite; this gate runs one
        # focused file and must not be judged against the global floor.
        run: pytest tests/test_public_demo_acceptance.py -q --no-header --no-cov
