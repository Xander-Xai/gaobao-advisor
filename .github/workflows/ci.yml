name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Generate synthetic demo database
        run: python -m scripts.seed_demo_data --db data/demo.db --reset
      - name: Run tests with coverage
        run: python -m pytest tests/ --tb=short --cov-fail-under=70
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  integration:
    name: MySQL + Redis + Admin Smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: gaobao_test
        ports:
          - "3307:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,mysql,worker]"
      - name: MySQL + Redis integration tests
        run: |
          MYSQL_TEST_URL='mysql+pymysql://root:testroot@127.0.0.1:3307/gaobao_test?charset=utf8mb4' \
          REDIS_TEST_URL='redis://127.0.0.1:6380/0' \
            python -m pytest tests/test_admin_mysql.py tests/test_mysql_migrations.py tests/test_admin_limits_redis.py tests/test_redis_worker.py tests/test_worker_integration.py tests/test_queue_recovery.py \
              -q --no-header --no-cov
      - name: Admin login -> quality job -> review -> audit smoke
        run: python scripts/admin_smoke.py
      - name: MySQL benchmark smoke
        run: |
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(host="127.0.0.1", port=3307, user="root", password="testroot")
          with connection.cursor() as cursor:
              cursor.execute("CREATE DATABASE IF NOT EXISTS gaobao_benchmark")
          connection.commit()
          connection.close()
          PY
          MYSQL_BENCH_URL='mysql+pymysql://root:testroot@127.0.0.1:3307/gaobao_benchmark?charset=utf8mb4' \
            python -m benchmarks.mysql_admin_benchmark \
              --schools 100 --scores-per-school 2 --audit-rows 500 --job-rows 20 \
              --concurrency 2 --warmup 1 --repeat 3 --json-out /tmp/benchmark-smoke.json
          python - <<'PY'
          import json
          result = json.load(open("/tmp/benchmark-smoke.json"))
          assert result["workloads"]["schools_page_1"]["samples"] == 3
          assert result["index_experiment"]["after"]["audit_page_1"]["samples"] == 3
          assert result["concurrency"]["error_rate"] == 0
          print("benchmark smoke ok")
          PY
      - name: Queue recovery smoke
        run: |
          MYSQL_BENCH_URL='mysql+pymysql://root:testroot@127.0.0.1:3307/gaobao_benchmark?charset=utf8mb4' \
          REDIS_BENCH_URL='redis://127.0.0.1:6380/0' \
            python -m benchmarks.queue_recovery.runner \
              --suite fault --schemes list --scenarios published_not_consumed duplicate_delivery \
              --repeats 1 --json-out /tmp/queue-recovery-smoke.json
          python - <<'PY'
          import json
          result = json.load(open("/tmp/queue-recovery-smoke.json"))
          assert result["faults"], "no queue recovery results"
          assert all(row["status"] == "PASS" for row in result["faults"]), result["faults"]
          print("queue recovery smoke ok")
          PY

  full-compose-e2e:
    name: Full Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install configuration generator dependencies
        run: python -m pip install -e .
      - name: Build and validate full Compose deployment (synthetic data)
        run: bash scripts/verify_full_compose_ci.sh
      - name: Upload full Compose failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-compose-e2e-logs
          path: ${{ runner.temp }}/gaobao-full-compose-logs/
          if-no-files-found: ignore
          retention-days: 3

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.lock --progress-spinner off
      - name: pip-audit (optional legacy admin dependency set)
        # The runtime lock above must stay at zero known vulnerabilities.
        # The legacy set is optional, never shipped and never installed by
        # default. E-001 was closed by streamlit 1.66.1 + pillow 13.0.0, so
        # this audit now has no ignore list. Any advisory in this set fails
        # the build.
        run: |
          pip install pip-audit
          pip-audit --requirement requirements-legacy-admin.lock --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (production)
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret Scan (Git History)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sensitive file guard (working tree)
        run: python scripts/check_sensitive_files.py --tracked
      - name: gitleaks (full history)
        run: |
          curl -sSL --retry 3 --fail \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build

  container:
    name: No-Key Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gb-advisor:ci .
      - name: Start without any API key
        run: |
          docker run -d --name gb-advisor -p 8000:8000 gb-advisor:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
      - name: Health must report synthetic profile and real RAG state
        run: |
          python - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          assert h["data_profile"] == "SYNTHETIC_DEMO", h
          rag = h["optional_services"]["rag"]
          assert rag["state"] == "RAG_ENABLED", h
          assert rag["integrity_ok"] is True, h
          assert rag["documents"] >= 1, h
          assert h["degraded_services"] == [], h
          print(json.dumps(h, indent=2))
          PY
      - name: Synthetic data endpoints respond
        run: |
          curl -sf "http://localhost:8000/api/v1/data/schools?limit=3" | python -c "import sys,json;d=json.load(sys.stdin);assert d['items'];print('schools ok:',len(d['items']))"
      - name: No-Key RAG returns evidence and citations
        run: |
          curl -sf -X POST "http://localhost:8000/api/v1/knowledge/search" \
            -H 'Content-Type: application/json' \
            -d '{"query":"平行志愿的投档规则是什么"}' > /tmp/kb.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/kb.json"))
          assert d["has_evidence"] is True, d
          assert d["count"] >= 1, d
          assert d["citations"] and all(c.get("source") for c in d["citations"]), d
          print("rag evidence ok:", d["count"], d["citations"][0]["source"])
          PY
      - name: Production Compose credential fail-closed + positive startup
        env:
          PROD_API_IMAGE: gb-advisor:ci
        run: bash scripts/verify_prod_compose_env.sh
      - if: always()
        run: docker logs gb-advisor || true

  redistribution-gate:
    name: Redistribution Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Generate synthetic demo database
        run: python -m scripts.seed_demo_data --db data/demo.db --reset
      - name: No restricted assets may be tracked
        # Coverage threshold belongs to the full suite; this gate runs one
        # focused file and must not be judged against the global floor.
        run: pytest tests/test_public_demo_acceptance.py -q --no-header --no-cov
