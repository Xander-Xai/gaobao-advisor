name: Temporary Ruff Format

on:
  push:
    branches:
      - fix/bug-audit-20260824
    paths:
      - '.github/workflows/tmp-ruff-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/bug-audit-20260824

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Format Python files
        run: ruff format .

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "style: apply ruff formatting"
          git push origin HEAD:fix/bug-audit-20260824
